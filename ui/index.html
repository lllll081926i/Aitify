<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aitify</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 监控状态 -->
    <section class="card">
      <div class="status-row">
        <div class="status-indicator">
          <span class="status-dot" id="watch-indicator"></span>
          <span class="status-text" id="watch-status-text">监控已停止</span>
        </div>
        <button class="btn btn-primary" id="btn-toggle-watch">启动</button>
      </div>
    </section>

    <!-- AI 源 -->
    <section class="card">
      <h3 class="card-title">AI 源</h3>
      <div class="sources-list">
        <div class="source-row">
          <label class="source-label">
            <span class="source-badge" style="background: #c4b5fd;">C</span>
            <span>Claude</span>
          </label>
          <div class="source-duration-inline">
            <label class="inline-label" for="source-claude-duration">最小时长</label>
            <input type="number" class="input-mini" id="source-claude-duration" min="0" value="0">
            <span class="unit">分钟</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="source-claude-enabled" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="source-row">
          <label class="source-label">
            <span class="source-badge" style="background: #93c5fd;">Cx</span>
            <span>Codex</span>
          </label>
          <div class="source-duration-inline">
            <label class="inline-label" for="source-codex-duration">最小时长</label>
            <input type="number" class="input-mini" id="source-codex-duration" min="0" value="0">
            <span class="unit">分钟</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="source-codex-enabled" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="source-row">
          <label class="source-label">
            <span class="source-badge" style="background: #a5b4fc;">Pi</span>
            <span>Pi</span>
          </label>
          <div class="source-duration-inline">
            <label class="inline-label" for="source-pi-duration">最小时长</label>
            <input type="number" class="input-mini" id="source-pi-duration" min="0" value="0">
            <span class="unit">分钟</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="source-pi-enabled" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="source-row">
          <label class="source-label">
            <span class="source-badge" style="background: #fdba74;">OC</span>
            <span>OpenCode</span>
          </label>
          <div class="source-duration-inline">
            <label class="inline-label" for="source-opencode-duration">最小时长</label>
            <input type="number" class="input-mini" id="source-opencode-duration" min="0" value="0">
            <span class="unit">分钟</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="source-opencode-enabled" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </section>

    <!-- 设置 -->
    <section class="card">
      <h3 class="card-title">设置</h3>
      <div class="settings-list">
        <div class="setting-row">
          <span class="setting-label">语言</span>
          <div class="native-select" id="setting-language" data-value="zh-CN">
            <button type="button" class="native-select-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="native-select-value">简体中文</span>
              <span class="native-select-chevron" aria-hidden="true"></span>
            </button>
            <div class="native-select-menu" role="listbox">
              <button type="button" class="native-select-option is-selected" role="option" data-value="zh-CN" aria-selected="true">简体中文</button>
              <button type="button" class="native-select-option" role="option" data-value="en-US" aria-selected="false">English</button>
            </div>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">开机自启</span>
          <label class="toggle">
            <input type="checkbox" id="setting-autostart">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">启动时隐藏窗口</span>
          <label class="toggle">
            <input type="checkbox" id="setting-silent-start">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <button class="btn btn-secondary" id="btn-test-desktop">测试通知</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span id="app-version">Aitify</span>
    </footer>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
